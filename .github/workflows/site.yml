name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 5 * *'      # the 5th of every month, 09:17 UTC
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download latest CMS files and rebuild data.json
        if: github.event_name != 'push'
        run: |
          pip install -r requirements.txt
          python scripts/refresh.py

      - name: Save the new data.json
        if: github.event_name != 'push'
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Refresh CMS data $(date +%F)" && git push)

      - name: Collect the site files
        run: |
          mkdir _site
          cp index.html data.json states.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
